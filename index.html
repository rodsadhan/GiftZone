<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Play - Professional Recharge Code</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

    <div class="w-full max-w-md bg-white shadow-xl min-h-screen sm:min-h-0 sm:rounded-3xl flex flex-col justify-between overflow-hidden relative">
        
        <div>
            <div class="relative w-full h-48 bg-gray-900">
                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80" alt="Promo Banner" class="w-full h-full object-cover opacity-95">
                
                <div class="absolute top-4 left-4 right-4 flex justify-between items-center z-20">
                    <div class="bg-black/40 backdrop-blur-md px-3 py-1.5 rounded-full text-white font-medium text-sm flex items-center gap-1">
                        <span>Balance:</span>
                        <span id="balanceText">₹0</span>
                    </div>

                    <div class="flex items-center gap-2 relative">
                        <button onclick="openHistory()" class="bg-black/30 backdrop-blur-md p-2 rounded-full text-white hover:bg-black/50 transition cursor-pointer" title="History">
                            <span class="material-symbols-outlined text-xl">history</span>
                        </button>

                        <button id="menuButton" class="bg-black/30 backdrop-blur-md p-2 rounded-full text-white hover:bg-black/50 transition cursor-pointer">
                            <span class="material-symbols-outlined text-xl">more_vert</span>
                        </button>

                        <div id="dropdownMenu" class="hidden absolute right-0 top-12 w-48 bg-white rounded-xl shadow-xl border border-gray-100 py-2 z-50 transform origin-top-right transition-all duration-200 scale-95 opacity-0">
                            <button onclick="openHelp()" class="w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 flex items-center gap-3 transition cursor-pointer">
                                <span class="material-symbols-outlined text-lg text-gray-500">help_outline</span> Get help
                            </button>
                            <button onclick="openFeedback()" class="w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 flex items-center gap-3 transition cursor-pointer">
                                <span class="material-symbols-outlined text-lg text-gray-500">feedback</span> Send feedback
                            </button>
                            <button onclick="logout()" class="w-full text-left px-4 py-3 text-sm text-red-600 hover:bg-gray-100 flex items-center gap-3 transition cursor-pointer">
                                <span class="material-symbols-outlined text-lg">logout</span> Logout
                            </button>
                        </div>
                    </div>
                </div>

                <div class="absolute bottom-3 left-4 right-4 text-center z-10">
                    <p class="text-white text-sm font-medium drop-shadow">Claim Exclusive Rewards & Recharge</p>
                </div>
            </div>

            <div class="p-5">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 flex items-center justify-center flex-shrink-0">
                        <svg class="w-9 h-9" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#ea4335" d="M31.258 35.127C27.355 40.184 25 47.168 25 55.772v400.456c0 8.604 2.355 15.588 6.258 20.645l4.037 3.376L239.54 275.9v-39.8L35.295 31.751l-4.037 3.376z"/>
                            <path fill="#fbbc04" d="M304.795 341.152l-65.255-65.052v-39.8l65.255-65.052 1.517.904 77.218 43.899c22.106 12.571 22.106 33.155 0 45.727l-77.218 43.899-1.517.904z"/>
                            <path fill="#34a853" d="M239.54 236.3L31.258 35.127c7.07-5.518 17.65-5.908 29.988 1.114l213.388 121.31-35.094 35.094z"/>
                            <path fill="#4285f4" d="M239.54 275.9l35.094 35.094L61.246 432.323c-12.338 7.022-22.918 6.632-29.988 1.114L239.54 275.9z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-lg font-normal text-gray-800">Google Play recharge code</h1>
                        <div onclick="firebaseLogin()" class="flex items-center gap-1 text-sm text-gray-600 cursor-pointer group">
                            <span class="w-5 h-5 bg-teal-700 text-white rounded-full flex items-center justify-center text-xs font-bold" id="avatarLetter">G</span>
                            <span class="truncate max-w-[200px] group-hover:text-blue-600 font-medium" id="displayEmail">Sign in with Google</span>
                        </div>
                    </div>
                </div>

                <h2 class="text-base font-medium text-gray-800 mb-4">Make a recharge</h2>

                <div class="relative border border-gray-400 rounded-lg px-4 pt-4 pb-2 focus-within:border-blue-600 focus-within:ring-1 focus-within:ring-blue-600 mb-2">
                    <label class="absolute -top-2.5 left-3 bg-white px-1 text-xs text-gray-600">Enter amount</label>
                    <div class="flex items-center text-2xl text-gray-900">
                        <span>₹</span>
                        <input id="amountInput" type="number" value="160" class="w-full focus:outline-none bg-transparent ml-1">
                    </div>
                </div>
                <p class="text-xs text-gray-500 mb-6">Enter amount between ₹10 and ₹5,000</p>

                <div class="flex gap-3 mb-8" id="presetButtons">
                    <button onclick="setAmount(50)" class="preset-btn border border-gray-300 rounded-full px-5 py-2 text-sm text-gray-700 hover:border-blue-600 hover:text-blue-600 transition cursor-pointer">₹50</button>
                    <button onclick="setAmount(160)" class="preset-btn border border-blue-600 bg-blue-50/50 rounded-full px-5 py-2 text-sm text-blue-600 font-medium cursor-pointer">₹160</button>
                    <button onclick="setAmount(800)" class="preset-btn border border-gray-300 rounded-full px-5 py-2 text-sm text-gray-700 hover:border-blue-600 hover:text-blue-600 transition cursor-pointer">₹800</button>
                </div>
            </div>
        </div>

        <div class="p-5 border-t border-gray-100 bg-white">
            <button onclick="processPayment()" class="w-full bg-[#0b57d0] text-white font-medium py-3.5 rounded-full hover:bg-blue-700 active:scale-95 transition-all duration-150 shadow-sm cursor-pointer">
                Pay now
            </button>
        </div>
    </div>

    <div id="customModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h3 id="modalTitle" class="text-lg font-medium text-gray-800 mb-2">Notice</h3>
            <p id="modalText" class="text-sm text-gray-600 mb-4">Content goes here...</p>
            <div class="flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 cursor-pointer">OK</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHjdC-MvzMpN4A_iTyH1r5VS2dH0MnSO0",
            authDomain: "giftzone-fe859.firebaseapp.com",
            projectId: "giftzone-fe859",
            storageBucket: "giftzone-fe859.firebasestorage.app",
            messagingSenderId: "1034654087061",
            appId: "1:1034654087061:web:cd7d8ecfc1c3b53d4e289c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let userBalance = 0;

        // UI toggles
        const menuButton = document.getElementById('menuButton');
        const dropdownMenu = document.getElementById('dropdownMenu');

        menuButton.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('hidden');
            dropdownMenu.classList.toggle('scale-95');
            dropdownMenu.classList.toggle('opacity-0');
        });

        window.addEventListener('click', () => {
            if (!dropdownMenu.classList.contains('hidden')) {
                dropdownMenu.classList.add('hidden', 'scale-95', 'opacity-0');
            }
        });

        window.showModal = (title, text) => {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('customModal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('customModal').classList.add('hidden');
        window.openHelp = () => showModal("Get Help", "Reach out via support@giftzone.com for code recovery queries.");
        window.openFeedback = () => showModal("Send Feedback", "Thank you for helping us optimize your recharge experience!");
        window.openHistory = () => showModal("Transaction History", "No successful redemptions tracked on this account yet.");

        window.setAmount = (amount) => {
            document.getElementById('amountInput').value = amount;
            document.querySelectorAll('.preset-btn').forEach(btn => {
                if (btn.innerText.includes(amount)) {
                    btn.className = "preset-btn border border-blue-600 bg-blue-50/50 rounded-full px-5 py-2 text-sm text-blue-600 font-medium cursor-pointer";
                } else {
                    btn.className = "preset-btn border border-gray-300 rounded-full px-5 py-2 text-sm text-gray-700 hover:border-blue-600 hover:text-blue-600 transition cursor-pointer";
                }
            });
        };

        // Real-time synchronization
        function loadBalance(user) {
            const userRef = doc(db, "users", user.uid);
            onSnapshot(userRef, (snap) => {
                if (snap.exists()) {
                    userBalance = snap.data().balance || 0;
                    document.getElementById("balanceText").innerText = "₹" + userBalance;
                }
            });
        }

        window.firebaseLogin = async function() {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                const userRef = doc(db, "users", user.uid);
                const snap = await getDoc(userRef);

                if (!snap.exists()) {
                    await setDoc(userRef, { email: user.email, balance: 0 });
                }
                alert("Login successful!");
            } catch (error) {
                alert("Login failed: " + error.message);
            }
        };

        window.logout = async function() {
            await signOut(auth);
            location.reload();
        };

        async function buyCode(amount) {
            if (!currentUser) return alert("Please sign in first.");
            const userRef = doc(db, "users", currentUser.uid);

            if (userBalance < amount) {
                let shortage = amount - userBalance;
                window.location.href = `addmoney.html?amount=${shortage}`;
                return;
            }

            try {
                await updateDoc(userRef, { balance: userBalance - amount });
                showModal("Success!", `Successfully redeemed code worth ₹${amount}.`);
            } catch (err) {
                alert("Transaction failed. Please try again.");
            }
        }

        window.processPayment = function() {
            let amount = Number(document.getElementById("amountInput").value);
            if (!currentUser) {
                window.firebaseLogin();
                return;
            }
            if (amount < 10 || amount > 5000) {
                alert("Please enter a valid amount between ₹10 and ₹5,000.");
                return;
            }
            buyCode(amount);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById("displayEmail").innerText = user.email;
                document.getElementById("avatarLetter").innerText = user.email.charAt(0).toUpperCase();
                loadBalance(user);
            } else {
                currentUser = null;
                document.getElementById("displayEmail").innerText = "Sign in with Google";
                document.getElementById("avatarLetter").innerText = "G";
                document.getElementById("balanceText").innerText = "₹0";
            }
        });
    </script>
</body>
</html>
